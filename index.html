<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SWARM Arena</title>
    <style>
        :root {
            color-scheme: dark;
            --ink: #10151b;
            --panel: #1b252d;
            --line: #38515e;
            --sky: #87ceeb;
            --gold: #f4b942;
            --text: #f7f7f2;
            --muted: #aab8bd;
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            overflow: hidden;
            background: var(--ink);
            color: var(--text);
            font-family: "Trebuchet MS", sans-serif;
        }
        canvas { display: block; }
        #startModal {
            position: fixed;
            inset: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            background: rgba(10, 15, 19, 0.94);
        }
        .setup {
            width: min(620px, 100%);
            border: 1px solid var(--line);
            background: var(--panel);
            padding: 32px;
            box-shadow: 12px 12px 0 rgba(0, 0, 0, 0.28);
        }
        h1 {
            margin: 0;
            color: var(--sky);
            font-size: 2.5rem;
            letter-spacing: 0;
        }
        .subtitle { color: var(--muted); margin: 8px 0 30px; }
        .slots { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
        .slot { border-top: 3px solid var(--gold); padding-top: 12px; display: flex; flex-direction: column; }
        .bot-description {
            margin-top: 12px;
            font-size: 0.85rem;
            color: var(--muted);
            line-height: 1.4;
            flex-grow: 1;
        }
        label { display: block; margin-bottom: 8px; font-size: 0.85rem; color: var(--muted); }
        select, button {
            width: 100%;
            border: 1px solid var(--line);
            border-radius: 0;
            font: inherit;
        }
        select { padding: 12px; color: var(--text); background: var(--ink); }
        .controls { margin: 28px 0; color: var(--muted); line-height: 1.6; }
        button {
            padding: 14px 20px;
            background: var(--sky);
            color: var(--ink);
            cursor: pointer;
            font-weight: 700;
        }
        button:hover { background: #bde8f7; }
        @media (max-width: 520px) {
            .setup { padding: 24px; }
            .slots { grid-template-columns: 1fr; }
        }

        #startBtn {
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <section id="startModal" aria-label="Arena setup">
        <div class="setup">
            <h1>SWARM - ARENA MÓD</h1>
            <p class="subtitle">Válassz két botot az arénába.</p>
            <div class="slots">
                <div class="slot">
                    <label for="leftBot">BAL OLDAL</label>
                    <select id="leftBot"></select>
                    <div id="leftDesc" class="bot-description"></div>
                </div>
                <div class="slot">
                    <label for="rightBot">JOBB OLDAL</label>
                    <select id="rightBot"></select>
                    <div id="rightDesc" class="bot-description"></div>
                </div>
            </div>
            <button id="startBtn" type="button">BELÉPÉS AZ ARÉNÁBA</button>
        </div>
    </section>
    <canvas id="gameCanvas"></canvas>
    <script type="module">
        import { Game } from './Game.js';
        import { getRegisteredBots } from './bots/BotRegistry.js';

        const canvas = document.getElementById('gameCanvas');
        const startModal = document.getElementById('startModal');
        const startBtn = document.getElementById('startBtn');
        const leftBot = document.getElementById('leftBot');
        const rightBot = document.getElementById('rightBot');
        const leftDesc = document.getElementById('leftDesc');
        const rightDesc = document.getElementById('rightDesc');
        let game = null;
        let animationFrameId = null;

        const botDescriptions = {
            'manual': 'Te irányítod a WASD és egér/bal klikk gombokkal szabadon',
            'idle-observer': 'Bot ami nem csinál semmit',
            'luna-low': 'Basic "blind" prompt-al készült. Csupán lő és gyorsan random mozog. Ára 8.4 kredit.',
            'luna-max': 'Basic "blind" prompt-al készült. Rosszul de prediktívan lő; menekül a golyózápor elől. Ára ~50 kredit',
            'terra-med': 'Basic "blind" prompt-al készült. Jól lő prediktívan, próbál dodge-olni, Ára: 21.7 kredit',
            'terra-max': 'Basic "blind" prompt-al készült. Jól lő prediktíven, próbál dodge-olni és vár energiát. Ára: 144.6 kredit',
            'sonnet5-max': 'Basic "blind" prompt-al készült. Prediktívan lő, super dodge-ol, energiát vár, nem hagyja magát beszorítani; Sonnet 5 modell-t használt MAX effort-al. Ára 477 kredit, de túlcsordult a limitemen. Csalt: megtalálta a többi botot* és versenyeztette/trainingelte vele magát egy általa kreált szimulált környezetben (* Mind, kivéve Gemini és Grok botok)',
            'gemini-3-flash': 'Speciális prompt-ot kapott bot, Gemini 3 Flash (preview) modell-t használva, High effort-on, Képes dodge-olni, mérlegelni, taktikákat használni, agresszívan támadni, optimálisan várni az energiatöltöttséget. Ára: 0.33 Premium request',
            'gemini-3-flash-2': 'Ugyanaz mint a normál "Gemini 3 Flash WP", viszont engedve lett hogy a Sonnet 5 Max-al szimuláljon játékmeneteket és ez alapján állítsa játékstílusát, így az Ára: 0.66 Premium request',
            'gemini-3-flash-3': 'A "Gemini 3 Flash WP | V2" továbbfejlesztése, további 1 prompt-ot kapva, ahol leírtam a tapasztalt hibákat, így ezeket javítva egy legyőzhetetlen botot alkotott.',
            'grok-45-max': 'Basic "blind" prompt-al készült, de korábban a Gemini speciális promptja által feltuning game engine-nek dolgozott, így teljesen dodge-ol, energiát vár, jól lő prediktívan. A jelenleg ingyenesen kipróbálható Grok 4.5 modell-lel készült, Max effort-al.',
            'grok-45-max-wp': 'Speciális prompt-ot kapott bot. Képes dodge-olni, mérlegelni, taktikákat használni, agresszívan támadni. A jelenleg ingyenesen kipróbálható Grok 4.5 modell-lel készült, Max effort-al.'
        };

        const resizeCanvas = () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        };
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const registeredBots = getRegisteredBots();
        const populateBotSelect = (select, selectedId) => {
            registeredBots.forEach(bot => {
                const option = document.createElement('option');
                option.value = bot.id;
                option.textContent = bot.name;
                select.appendChild(option);
            });
            select.value = selectedId;
        };
        populateBotSelect(leftBot, 'manual');
        populateBotSelect(rightBot, 'idle-observer');

        const updateDescriptions = () => {
            leftDesc.textContent = botDescriptions[leftBot.value] || '';
            rightDesc.textContent = botDescriptions[rightBot.value] || '';
        };
        updateDescriptions();

        const rematch = () => {
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            if (game) game.cleanup();
            game = null;
            startModal.style.display = 'grid';
        };

        window.addEventListener('keydown', (e) => {
            if (e.key.toLowerCase() === 'r' && game && game.matchEnded) {
                rematch();
            }
        });

        const updateManualOption = (changedSelect, otherSelect) => {
            const manualOption = [...otherSelect.options].find(option => option.value === 'manual');
            manualOption.disabled = changedSelect.value === 'manual';
            if (manualOption.disabled && otherSelect.value === 'manual') {
                otherSelect.value = registeredBots.find(bot => bot.id !== 'manual').id;
            }
        };
        leftBot.addEventListener('change', () => {
            updateManualOption(leftBot, rightBot);
            updateDescriptions();
        });
        rightBot.addEventListener('change', () => {
            updateManualOption(rightBot, leftBot);
            updateDescriptions();
        });

        startBtn.addEventListener('click', () => {
            startModal.style.display = 'none';
            resizeCanvas();
            game = new Game(canvas, { left: leftBot.value, right: rightBot.value });

            const gameLoop = timestamp => {
                if (!game) return;
                const deltaTime = Math.min(64, timestamp - (gameLoop.lastTimestamp || timestamp));
                gameLoop.lastTimestamp = timestamp;
                game.update(deltaTime);
                game.draw();
                animationFrameId = requestAnimationFrame(gameLoop);
            };
            gameLoop(performance.now());
        });

        window.addEventListener('beforeunload', () => {
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            if (game) game.cleanup();
        });
    </script>
</body>
</html>
