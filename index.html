<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SWARM Arena</title>
    <style>
        :root {
            color-scheme: dark;
            --ink: #10151b;
            --panel: #1b252d;
            --line: #38515e;
            --sky: #87ceeb;
            --gold: #f4b942;
            --text: #f7f7f2;
            --muted: #aab8bd;
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            overflow: hidden;
            background: var(--ink);
            color: var(--text);
            font-family: "Trebuchet MS", sans-serif;
        }
        canvas { display: block; }
        #startModal {
            position: fixed;
            inset: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            background: rgba(10, 15, 19, 0.94);
        }
        .setup {
            width: min(620px, 100%);
            border: 1px solid var(--line);
            background: var(--panel);
            padding: 32px;
            box-shadow: 12px 12px 0 rgba(0, 0, 0, 0.28);
        }
        h1 {
            margin: 0;
            color: var(--sky);
            font-size: 2.5rem;
            letter-spacing: 0;
        }
        .subtitle { color: var(--muted); margin: 8px 0 30px; }
        .slots { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
        .slot { border-top: 3px solid var(--gold); padding-top: 12px; }
        label { display: block; margin-bottom: 8px; font-size: 0.85rem; color: var(--muted); }
        select, button {
            width: 100%;
            border: 1px solid var(--line);
            border-radius: 0;
            font: inherit;
        }
        select { padding: 12px; color: var(--text); background: var(--ink); }
        .controls { margin: 28px 0; color: var(--muted); line-height: 1.6; }
        button {
            padding: 14px 20px;
            background: var(--sky);
            color: var(--ink);
            cursor: pointer;
            font-weight: 700;
        }
        button:hover { background: #bde8f7; }
        @media (max-width: 520px) {
            .setup { padding: 24px; }
            .slots { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <section id="startModal" aria-label="Arena setup">
        <div class="setup">
            <h1>SWARM ARENA</h1>
            <p class="subtitle">Select the two bot placeholders that enter the arena.</p>
            <div class="slots">
                <div class="slot">
                    <label for="leftBot">LEFT SIDE</label>
                    <select id="leftBot"></select>
                </div>
                <div class="slot">
                    <label for="rightBot">RIGHT SIDE</label>
                    <select id="rightBot"></select>
                </div>
            </div>
            <button id="startBtn" type="button">ENTER ARENA</button>
        </div>
    </section>
    <canvas id="gameCanvas"></canvas>
    <script type="module">
        import { Game } from './Game.js';
        import { getRegisteredBots } from './bots/BotRegistry.js';

        const canvas = document.getElementById('gameCanvas');
        const startModal = document.getElementById('startModal');
        const startBtn = document.getElementById('startBtn');
        const leftBot = document.getElementById('leftBot');
        const rightBot = document.getElementById('rightBot');
        let game = null;
        let animationFrameId = null;

        const resizeCanvas = () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        };
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const registeredBots = getRegisteredBots();
        const populateBotSelect = (select, selectedId) => {
            registeredBots.forEach(bot => {
                const option = document.createElement('option');
                option.value = bot.id;
                option.textContent = bot.name;
                select.appendChild(option);
            });
            select.value = selectedId;
        };
        populateBotSelect(leftBot, 'idle-sentinel');
        populateBotSelect(rightBot, 'idle-observer');

        const updateManualOption = (changedSelect, otherSelect) => {
            const manualOption = [...otherSelect.options].find(option => option.value === 'manual');
            manualOption.disabled = changedSelect.value === 'manual';
            if (manualOption.disabled && otherSelect.value === 'manual') {
                otherSelect.value = registeredBots.find(bot => bot.id !== 'manual').id;
            }
        };
        leftBot.addEventListener('change', () => updateManualOption(leftBot, rightBot));
        rightBot.addEventListener('change', () => updateManualOption(rightBot, leftBot));

        startBtn.addEventListener('click', () => {
            startModal.style.display = 'none';
            resizeCanvas();
            game = new Game(canvas, { left: leftBot.value, right: rightBot.value });

            const gameLoop = timestamp => {
                if (!game) return;
                const deltaTime = Math.min(64, timestamp - (gameLoop.lastTimestamp || timestamp));
                gameLoop.lastTimestamp = timestamp;
                game.update(deltaTime);
                game.draw();
                animationFrameId = requestAnimationFrame(gameLoop);
            };
            gameLoop(performance.now());
        });

        window.addEventListener('beforeunload', () => {
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            if (game) game.cleanup();
        });
    </script>
</body>
</html>
